<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colonial America Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: one narrow column, a tab strip on top, one drill at a time. Colonial printed-page type for terms, plain sans for answers. */
:root {
  --bg: #ECEFF0;
  --surface: #FFFFFF;
  --ink: #18222D;
  --muted: #566370;
  --line: #C9D1D6;
  --chip: #DFE5E8;
  --accent: #1D4E6B;
  --accent-ink: #FFFFFF;
  --good: #276E5D;
  --good-bg: #DCEEE8;
  --bad: #A93A2A;
  --bad-bg: #F5DDD8;
  --f-display: "IM Fell English", Georgia, "Times New Roman", serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171F; --surface: #17222D; --ink: #E6ECEF; --muted: #93A1AC; --line: #2B3A48; --chip: #213140;
    --accent: #7DBBDD; --accent-ink: #0B1720; --good: #6CCDB3; --good-bg: #16352D; --bad: #F09384; --bad-bg: #3A201C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171F; --surface: #17222D; --ink: #E6ECEF; --muted: #93A1AC; --line: #2B3A48; --chip: #213140;
  --accent: #7DBBDD; --accent-ink: #0B1720; --good: #6CCDB3; --good-bg: #16352D; --bad: #F09384; --bad-bg: #3A201C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.wrap { max-width: 760px; margin: 0 auto; }
header .eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 7vw, 44px); line-height: 1.1; margin: 4px 0 2px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }

.tabs { display: flex; gap: 4px; overflow-x: auto; margin: 18px 0 18px; border-bottom: 1px solid var(--line); }
.tabs button {
  flex: 0 0 auto; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted);
  font: 500 15px var(--f-body); padding: 10px 14px 9px; cursor: pointer;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.chip {
  background: var(--chip); color: var(--ink); border: 1px solid transparent; border-radius: 999px;
  font: 500 14px var(--f-body); padding: 6px 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.spacer { flex: 1 1 auto; }
.btn {
  font: 600 15px var(--f-body); padding: 11px 18px; border-radius: 6px; cursor: pointer;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row > .btn { flex: 1 1 140px; }

.meter { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); width: 0; }
.meta { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); margin: 6px 0 14px; }

.card {
  width: 100%; min-height: 270px; text-align: left; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 22px 22px 20px; cursor: pointer;
  display: flex; flex-direction: column; justify-content: center; gap: 12px; margin-bottom: 14px;
}
.card .tag { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card .front { font-family: var(--f-display); font-size: clamp(28px, 6.5vw, 40px); line-height: 1.15; text-wrap: balance; }
.card .back { font-size: 18px; line-height: 1.5; }
.card .hint { font-size: 13px; color: var(--muted); }
.card.flipped { border-color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 14px; }
.panel h2, .section h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.15; margin: 0 0 8px; }
.panel p { margin: 0 0 10px; }
.sub { color: var(--muted); font-size: 14.5px; }

.q { font-family: var(--f-display); font-size: clamp(22px, 5vw, 28px); line-height: 1.25; margin: 6px 0 14px; text-wrap: balance; }
.opts { display: grid; gap: 8px; margin-bottom: 14px; }
.opt {
  text-align: left; font: 400 16px/1.4 var(--f-body); color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 6px; padding: 12px 14px; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt:disabled { cursor: default; color: var(--ink); }
.fb { font-size: 15px; margin: 0 0 14px; }
.fb b.ok { color: var(--good); } .fb b.no { color: var(--bad); }

.pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.ev {
  font: 500 15px var(--f-body); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);
  border-radius: 6px; padding: 9px 12px; cursor: pointer; text-align: left;
}
.ev:hover { border-color: var(--accent); }
ol.order { list-style: none; counter-reset: n; padding: 0; margin: 0 0 14px; display: grid; gap: 6px; }
ol.order li {
  counter-increment: n; display: flex; gap: 10px; align-items: baseline; background: var(--surface);
  border: 1.5px dashed var(--line); border-radius: 6px; padding: 8px 12px; min-height: 42px;
}
ol.order li::before { content: counter(n); font-family: var(--f-mono); font-size: 13px; color: var(--muted); width: 1.6em; }
ol.order li.filled { border-style: solid; }
ol.order li.filled button { all: unset; cursor: pointer; flex: 1; }
ol.order li.ok { background: var(--good-bg); border-color: var(--good); }
ol.order li.no { background: var(--bad-bg); border-color: var(--bad); }
.yr { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.key { margin: 0 0 14px; padding-left: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; }
.key li { display: flex; gap: 10px; }
.key .yr { min-width: 8.5em; }

.dec { border-top: 1px solid var(--line); padding: 14px 0; }
.dec:first-of-type { border-top: 0; }
.dec p { margin: 0 0 10px; }
.dec .fbk { font-size: 14.5px; margin-top: 8px; }

.ident { border-top: 1px solid var(--line); padding: 16px 0; }
.ident:first-of-type { border-top: 0; }
.ident h3 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0 0 6px; }
textarea {
  width: 100%; min-height: 76px; resize: vertical; font: 400 16px/1.45 var(--f-body); color: var(--ink);
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 4px 0 8px;
}
.model { background: var(--good-bg); border-left: 4px solid var(--good); padding: 10px 12px; border-radius: 0 6px 6px 0; margin-top: 8px; }

.cat { margin: 18px 0 8px; }
.cat h3 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0 0 8px; }
.mask {
  display: flex; gap: 10px; width: 100%; text-align: left; font: 400 15.5px/1.45 var(--f-body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; margin-bottom: 6px; cursor: pointer;
}
.mask .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); min-width: 1.6em; padding-top: 2px; }
.mask .t { flex: 1; min-width: 0; filter: blur(7px); user-select: none; transition: filter .15s; }
.mask.on .t { filter: none; user-select: auto; }
.thesis.mask .t { font-size: 16px; }
@media (prefers-reduced-motion: reduce) { .mask .t { transition: none; } }
.lcards { display: grid; gap: 10px; margin: 12px 0 18px; }
.lcard {
  display: grid; gap: 2px; text-align: left; width: 100%; font: inherit; color: var(--ink); cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 13px 14px;
}
.lcard:hover { border-color: var(--accent); }
.lcard .lt { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lcard b { font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.2; }
.lcard .ls { color: var(--muted); font-size: 14px; }
.lcard .st { font-family: var(--f-mono); font-size: 12px; color: var(--good); }
.pips { display: inline-flex; gap: 5px; margin-top: 6px; }
.pip { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--accent); }
.pip.l1 { background: var(--accent); opacity: .4; }
.pip.l2 { background: var(--accent); opacity: .7; }
.pip.l3 { background: var(--accent); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; }
.steps span { font-family: var(--f-mono); font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.steps .on { background: var(--accent); color: var(--accent-ink); }
.steps .past { color: var(--good); }
.strip { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.strip span { font-family: var(--f-mono); font-size: 13px; padding: 4px 9px; border-radius: 6px; border: 1.5px solid var(--line); color: var(--muted); }
.strip .cur { border-color: var(--accent); background: var(--surface); color: var(--ink); }
.study { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 14px; }
.yearbig { font-family: var(--f-mono); font-weight: 500; font-size: clamp(38px, 11vw, 60px); line-height: 1; color: var(--accent); overflow-wrap: anywhere; }
.study h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(24px, 6vw, 32px); line-height: 1.15; margin: 8px 0 4px; text-wrap: balance; }
.lab { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
.study p { margin: 0; }
.hook { background: var(--chip); border-left: 4px solid var(--accent); border-radius: 0 6px 6px 0; padding: 10px 12px; margin-top: 14px; }
.hook .lab { margin-top: 0; }
.note { font-size: 13.5px; color: var(--muted); font-style: italic; margin-top: 10px; }
.yr-in { font: 500 24px var(--f-mono); width: 100%; max-width: 220px; padding: 10px 12px; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; margin-bottom: 12px; }
.cheat { columns: 1; margin: 8px 0 0; padding: 0; list-style: none; font-size: 15px; display: grid; gap: 3px; }
.cheat li { display: flex; gap: 10px; }
.cheat .yr { min-width: 8.2em; }
.done { text-align: center; padding: 26px 8px; }
.done .big { font-family: var(--f-display); font-size: 44px; line-height: 1; margin: 0 0 6px; }
.missed { text-align: left; margin: 14px 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.missed li { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 15px; }
.missed b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 19px; }
html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">US History I Honors</div>
    <h1>Colonial America Drill</h1>
    <p>Chapters 2 and 3, 1492 to 1718. Learn the dates first, then drill them.</p>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- data ---------- */
const CARDS = [
 // chapter 2
 [2,'Person','Christopher Columbus','Landed on San Salvador (1492) thinking he had reached Asia and called the Taino "Indians." Killed Tainos in retribution (1494) after his men were killed on Hispaniola. A new governor sent him home in chains.'],
 [2,'Term','Taino','Friendly, unarmed Caribbean people Columbus met. About 1 million lived on Hispaniola; only about 1,000 were left by the early 1500s, mostly from disease.'],
 [2,'Term','Treaty of Tordesillas (1494)','The Pope divided the New World between Spain and Portugal. This is why Brazil speaks Portuguese and the rest of South America speaks Spanish.'],
 [2,'Person','Amerigo Vespucci','Italian merchant who sailed Brazil\'s coast and decided the land was a new continent, not Asia. "America" was named for him on a 1507 German map.'],
 [2,'Person','Nicolas de Ovando','Spanish governor who in 1503 invited the caciques (district chiefs) to a "friendly" meeting, locked the doors, and burned the building.'],
 [2,'Term','Columbian Exchange','The interchange of diseases, plants, animals, and cultures between the Old and New Worlds after 1492. Corn, beans, potatoes went east; wheat, cattle, pigs, horses went west.'],
 [2,'Term','Silk Road','Overland trade route between Venice and China. Atlantic sea routes later made Spain and Portugal the key links to Asia, replacing Genoa and Venice.'],
 [2,'Person','Vasco Nunez de Balboa','First European to see the Pacific Ocean (1513, Isthmus of Panama).'],
 [2,'Person','Ferdinand Magellan','Led the 1519 attempt to sail around the world. He was killed on the way, but his remaining crew finished the trip in 1522.'],
 [2,'Person','Hernan Cortes','Conquered the Aztecs (1519-21). Took Tenochtitlan, renamed it Mexico City, and retook it in 1521 with help from non-Aztec tribes tired of Aztec rule.'],
 [2,'Term','New Spain and the viceroy','Spain\'s empire in Mexico and Central America, ruled from Mexico City by a viceroy, the king\'s representative.'],
 [2,'Person','Francisco Pizarro','Defeated the Inca emperor in 1532. The empire became the Viceroyalty of Peru, which produced gold using about 45,000 enslaved miners.'],
 [2,'Term','Why Spain conquered so fast','Native allies, Spanish dishonesty about friendship, superior technology, and smallpox. The Aztecs lost up to half their people, and an Inca emperor died of it before Pizarro arrived.'],
 [2,'Person','Bartolome de Las Casas','Priest who gave up his encomienda in 1514 and preached against the oppression of Indians. His writing documents conquistador cruelty.'],
 [2,'Term','Encomienda','A large ranch or estate granted to a Spaniard and worked by Indian slaves.'],
 [2,'Term','Conquistadores','The Spanish conquerors of the Americas.'],
 [2,'Person','Martin Luther','German monk whose 95 Theses began the Protestant Reformation. He challenged bishops-only Bible interpretation and salvation through "good works."'],
 [2,'Term','Nation-state','An independent nation, replacing the old ideal of a Europe united by one religion and government. Boundaries often matched religion.'],
 [2,'Term','Peace of Augsburg (1555) and Treaty of Westphalia (1648)','Treaties that let the ruler\'s faith decide the people\'s faith, tying national unity to religious uniformity.'],
 [2,'Person','Juan Ponce de Leon','Founded the first Spanish colony in Puerto Rico and led expeditions to Florida (1513, 1521), supposedly seeking a "fountain of youth." Died from a poisoned arrow.'],
 [2,'Person','Esteban','African Muslim who survived the Narvaez expedition, walked about 8 years to Mexico City, then scouted for de Niza and was killed by the Zuni.'],
 [2,'Person','Cabeza de Vaca','Narvaez expedition survivor. Wrote that Natives saw the survivors as different from earlier Spaniards because they came "naked and barefoot" and cured the sick.'],
 [2,'Term','Seven Cities of Cibola','Legend of seven rich cities founded by bishops fleeing Muslim Spain. De Niza searched for them in 1539 and Coronado found none.'],
 [2,'Person','Francisco Vazquez de Coronado','Led a large 1540-42 expedition through Arizona, New Mexico, Texas, Oklahoma, and Kansas. Found no gold; Pueblos steered him away with tales of rich cities.'],
 [2,'Person','Hernando de Soto','Led a 1539 expedition of 500-600 Spaniards through Florida, Georgia, and the Carolinas. Took prisoners and killed the generous. Died in 1542 and was buried in the Mississippi River.'],
 [2,'Person','Juan Rodriguez Cabrillo','Explored the Pacific coast for Spain (1542-43) as far as the Russian River in northern California.'],
 [2,'Place','St. Augustine (1565)','Founded by Menendez de Aviles. The oldest city of European origin in the U.S. Spain claimed all land north and west of it.'],
 [2,'Place','Fort Caroline (1564)','French Protestant colony in Florida. Menendez de Aviles destroyed it in 1565 and killed the survivors of the French rescue fleet.'],
 [2,'Term','Primogeniture','Land passes whole to the oldest son, so younger sons became soldiers or priests. Many sought wealth through conquest.'],
 [2,'Person','Juan de Onate','Claimed New Mexico for Spain (1598). Burned Acoma (1,000 killed), hanged Jumano chiefs, and was recalled in 1609. Santa Fe then became the capital.'],
 [2,'Person','Giovanni da Verrazano','Italian exploring for France (1524). First European to explore New York Harbor; concluded a continent blocked the way to Asia.'],
 [2,'Person','Jacques Cartier','Explored the St. Lawrence for France starting in 1534 and reached the sites of Quebec and Montreal. Lost a quarter of his crew when the river froze.'],
 [2,'Person','John Cabot','Sailed for Henry VII in 1497 and reached Newfoundland. His first voyage became the basis of English claims in North America.'],
 [2,'Person','Henry VIII','Broke with the Pope after being refused a divorce. Parliament made him "Supreme Head" of the Church of England.'],
 [2,'Term','Act of Uniformity (1559)','Elizabeth I became "Supreme Governor" of the Church of England. Worship followed the Book of Common Prayer and weekly attendance was required.'],
 [2,'Term','Anglicans, Puritans, Catholics','England\'s three religious groups by 1547: the majority Anglicans, Puritans who wanted to "purify" the church, and Catholics who rejected Henry\'s break with the Pope.'],
 [2,'Event','Spanish Armada (1588)','Spain\'s invasion fleet, destroyed by storms and the English navy. It linked Protestantism with English patriotism.'],
 [2,'Person','Francis Drake','English privateer who raided Spanish ships (keeping 4/5 of the prizes), sailed up California\'s coast, and circled the globe, returning in 1580.'],
 [2,'Person','Walter Raleigh','Authorized in 1584 to settle North America. His Roanoke colonies (1585, 1587) failed; Virginia Dare was born there; the colony was found abandoned in 1590.'],
 // chapter 3
 [3,'Term','Virginia Company','Investors who funded Jamestown (1607) hoping for raw materials and a passage to China. Bankrupted after 1622; Virginia became a royal colony in 1624.'],
 [3,'Place','Jamestown (1607)','Founded by 105 men and named for King James I. Bad water, drought, and infighting left only 38 alive by 1608. Built on Paspahegh land.'],
 [3,'Person','Powhatan','Ruled about 30 Algonquian tribes (13,000-15,000 people) "like an emperor." Traded with the English to strengthen himself against rival tribes.'],
 [3,'Person','John Smith','Jamestown governor in 1608 who ruled "he who does not work, does not eat." Credited himself with saving the colony and left in 1609.'],
 [3,'Person','Pocahontas','Powhatan\'s daughter. In Smith\'s story she saved him from execution (historians think Powhatan staged it). Later married John Rolfe.'],
 [3,'Event','Starving Time (1609-10)','Winter when Jamestown nearly died of starvation and disease. Settlers left in spring 1610 but met De La Warr\'s supply fleet and stayed.'],
 [3,'Person','Opechancanough','Powhatan\'s brother. His 1622 attack killed about 300 of 1,200 settlers and helped bankrupt the Virginia Company.'],
 [3,'Term','Tobacco','The cash crop that saved Virginia. King James hated it but profited from a royal monopoly. It created a huge demand for workers.'],
 [3,'Term','Hakluyt\'s Pamphlet (1585)','Richard Hakluyt the elder\'s argument for English settlement: convert Natives to Protestantism, make a profit, and build a military base against Spain.'],
 [3,'Event','Africans arrive in Jamestown (1619)','About 20 Africans arrived. Their status was unclear (maybe indentured), and they worked alongside English and Irish servants.'],
 [3,'Term','Indentured servants','Workers bound for a set term. Most died before finishing until the 1640s. Phased out after Bacon\'s Rebellion in favor of enslaved labor.'],
 [3,'Person','Anthony Johnson','Sold as a slave in Jamestown (1621), won his freedom, and owned a 250-acre farm and a slave. By the 1700s no one could repeat this.'],
 [3,'Term','Puritans vs. Separatists','Puritans wanted to purify the Church of England from within. Separatists (the Pilgrims) wanted to leave and form their own churches.'],
 [3,'Event','Mayflower Compact (1620)','Agreement signed on the ship to govern themselves after landing north of their grant. Seen as an early step toward government by consent.'],
 [3,'Place','Plymouth (1620)','Second permanent English colony. 102 passengers (half "Saints," half "Strangers"). Half died the first winter. The site was empty because disease had wiped out the Indians there.'],
 [3,'Person','Samoset','Native of Maine who walked into Plymouth in 1621 and said "Welcome, Englishmen!" Sent by Massasoit.'],
 [3,'Person','Massasoit','Wampanoag leader whose agreement with Plymouth brought 54 years of peace. His people brought deer to the 1621 harvest feast.'],
 [3,'Person','Squanto','Translator once captured by English explorers and taken to London. Taught Plymouth to catch eels and to fertilize corn with herring.'],
 [3,'Person','William Bradford','Plymouth governor and historian (Of Plymouth Plantation). Announced the 1621 harvest feast now called the first Thanksgiving.'],
 [3,'Person','John Winthrop','First governor of Massachusetts Bay (1630). "City upon a hill": a Christian commonwealth as a model for England.'],
 [3,'Event','Great Migration','About 20,000 Puritans came to Massachusetts in the 1630s. The colony soon had more people than Plymouth and Jamestown combined.'],
 [3,'Term','Great and General Court','Massachusetts Bay\'s governing body (still the name of the state legislature). Annual elections, but only church members in good standing could vote.'],
 [3,'Term','Massachusetts school laws','Harvard (1636) to train ministers, Boston Latin, and the 1647 law requiring every township to have a school. Puritans needed everyone to read the Bible.'],
 [3,'Event','Fundamental Orders of Connecticut (1639)','Hartford colony\'s formal government. More men could vote than in Massachusetts. Called the first written constitution in America (disputed).'],
 [3,'Person','Roger Williams','Convicted of "erroneous" opinions (1635). Founded Providence (Rhode Island) on religious toleration and paid the Indians for the land.'],
 [3,'Person','Anne Hutchinson','Claimed direct revelations from God. Exiled to Rhode Island, then killed by Indians in Dutch New Amsterdam (1643).'],

/* ---------- tabs / routing ---------- */
const TABS = [['learn','Learn'],['cards','Flashcards'],['quiz','Quiz'],['timeline','Timeline'],['identify','Identifiers'],['recall','Recall']];
let tab = 'learn';
const view = document.getElementById('view');
const tabsEl = document.getElementById('tabs');
function drawTabs() {
  tabsEl.innerHTML = TABS.map(([id, name]) => `<button role="tab" data-t="${id}" aria-selected="${id === tab}">${name}</button>`).join('');
}
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('button[data-t]'); if (!b) return;
  setTab(b.dataset.t);
});
function setTab(id) {
  tab = id; drawTabs();
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  render();
}
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (TABS.some(t => t[0] === id) && id !== tab) { tab = id; drawTabs(); render(); }
});
function render() { ({ learn: renderLearn, cards: renderCards, quiz: renderQuiz, timeline: renderTimeline, identify: renderIdentify, recall: renderRecall })[tab](); }

/* ---------- FLASHCARDS ---------- */
const FC = { scope: 'all', mode: 'all', deck: [], pos: 0, flipped: false, known: new Set(store.get('cad-known', [])), seen: 0 };
const inScope = c => FC.scope === 'all' || String(c.ch) === String(FC.scope);
function buildDeck() {
  let d = CARDS.filter(inScope);
  if (FC.mode === 'unknown') d = d.filter(c => !FC.known.has(c.id));
  FC.deck = shuffle(d); FC.pos = 0; FC.flipped = false;
}
function saveKnown() { store.set('cad-known', Array.from(FC.known)); }
function renderCards() {
  if (!FC.deck.length && FC.pos === 0 && !FC._built) { buildDeck(); FC._built = true; }
  const scoped = CARDS.filter(inScope);
  const knownN = scoped.filter(c => FC.known.has(c.id)).length;
  const chip = (g, v, label) => `<button class="chip" data-g="${g}" data-v="${v}" aria-pressed="${String(FC[g]) === String(v)}">${label}</button>`;
  let html = `<div class="bar">${chip('scope','all','All')}${chip('scope','2','Chapter 2')}${chip('scope','3','Chapter 3')}<span class="spacer"></span>${chip('mode','all','Every card')}${chip('mode','unknown','Still learning')}</div>
    <div class="meter" aria-hidden="true"><i style="width:${scoped.length ? Math.round(knownN / scoped.length * 100) : 0}%"></i></div>
    <div class="meta"><span>${knownN} of ${scoped.length} marked known</span><span>${FC.deck.length ? Math.min(FC.pos + 1, FC.deck.length) + ' / ' + FC.deck.length : ''}</span></div>`;
  if (!FC.deck.length) {
    html += `<div class="panel done"><p class="big">Nothing left</p><p class="sub">Every card in this set is marked known. Switch to "Every card" to review them again.</p></div>`;
  } else if (FC.pos >= FC.deck.length) {
    const left = FC.deck.filter(c => !FC.known.has(c.id)).length;
    html += `<div class="panel done"><p class="big">Round done</p><p>${left} still learning out of ${FC.deck.length}.</p>
      <div class="row"><button class="btn" id="again">${left ? 'Drill the ' + left + ' still learning' : 'Go again'}</button><button class="btn ghost" id="restart">Reshuffle everything</button></div></div>`;
  } else {
    const c = FC.deck[FC.pos];
    html += `<button class="card ${FC.flipped ? 'flipped' : ''}" id="card" aria-label="Flashcard. Press to flip.">
      <span class="tag">Chapter ${c.ch} &middot; ${c.type}</span>
      ${FC.flipped ? `<span class="back">${esc(c.a)}</span>` : `<span class="front">${esc(c.q)}</span><span class="hint">Say the answer out loud, then tap to flip.</span>`}
    </button>
    <div class="row"><button class="btn ghost" id="learn">Still learning</button><button class="btn" id="got">Got it</button></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="prev" ${FC.pos === 0 ? 'disabled' : ''}>Back</button><button class="btn ghost" id="skip">Skip</button></div>`;
  }
  view.innerHTML = html;
}
function fcAdvance() { FC.pos++; FC.flipped = false; renderCards(); }
view.addEventListener('click', e => {
  if (tab !== 'cards') return;
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.g) { FC[t.dataset.g] = t.dataset.v; buildDeck(); FC._built = true; renderCards(); return; }
  if (t.id === 'card') { FC.flipped = !FC.flipped; renderCards(); const n = document.getElementById('card'); if (n) n.focus(); }
  else if (t.id === 'got') { FC.known.add(FC.deck[FC.pos].id); saveKnown(); fcAdvance(); }
  else if (t.id === 'learn') { FC.known.delete(FC.deck[FC.pos].id); saveKnown(); fcAdvance(); }
  else if (t.id === 'skip') fcAdvance();
  else if (t.id === 'prev') { FC.pos = Math.max(0, FC.pos - 1); FC.flipped = false; renderCards(); }
  else if (t.id === 'again') { const left = FC.deck.filter(c => !FC.known.has(c.id)); FC.deck = shuffle(left.length ? left : FC.deck); FC.pos = 0; FC.flipped = false; renderCards(); }
  else if (t.id === 'restart') { buildDeck(); renderCards(); }
});

/* ---------- QUIZ ---------- */
const QZ = { phase: 'setup', scope: 'all', n: 10, qs: [], i: 0, picked: null, score: 0, missed: [] };
function pick(arr, n, not) { return shuffle(arr.filter(x => !not.includes(x))).slice(0, n); }
function makeQuestion(card, pool) {
  const roll = Math.random();
  const others = pool.filter(c => c.id !== card.id);
  if (roll < 0.5) { // describe -> name
    const wrong = pick(others.map(c => c.q), 3, [card.q]);
    return { prompt: card.a, lead: 'Which one is this?', opts: shuffle([card.q, ...wrong]), answer: card.q, why: card.a, name: card.q };
  }
  const wrong = pick(others.map(c => c.a), 3, [card.a]);
  return { prompt: card.q, lead: 'What is it?', opts: shuffle([card.a, ...wrong]), answer: card.a, why: card.a, name: card.q };
}
function makeDateQuestion(ev) {
  const wrong = pick(Array.from(new Set(EVENTS.map(e => e.d))), 3, [ev.d]);
  return { prompt: ev.n, lead: 'When did this happen?', opts: shuffle([ev.d, ...wrong]), answer: ev.d, why: ev.n + ': ' + ev.d, name: ev.n };
}
function startQuiz(qs) { QZ.qs = qs; QZ.i = 0; QZ.picked = null; QZ.score = 0; QZ.missed = []; QZ.phase = 'run'; renderQuiz(); }
function buildQuiz() {
  const pool = CARDS.filter(c => QZ.scope === 'all' || String(c.ch) === String(QZ.scope));
  const dateOK = QZ.scope !== '2';
  const picks = shuffle(pool).slice(0, QZ.n);
  const qs = picks.map(c => (dateOK && Math.random() < 0.15) ? makeDateQuestion(EVENTS[Math.floor(Math.random() * EVENTS.length)]) : makeQuestion(c, pool));
  startQuiz(qs);
}
function renderQuiz() {
  if (QZ.phase === 'setup') {
    const chip = (g, v, label) => `<button class="chip" data-qg="${g}" data-v="${v}" aria-pressed="${String(QZ[g]) === String(v)}">${label}</button>`;
    view.innerHTML = `<div class="panel"><h2>Multiple choice</h2><p class="sub">Questions are pulled at random from every flashcard, so each round is different. Some ask you to name the term, some to recall what it was, and a few ask for dates.</p>
      <p><b>Chapter</b></p><div class="bar">${chip('scope','all','Both')}${chip('scope','2','Chapter 2')}${chip('scope','3','Chapter 3')}</div>
      <p><b>Length</b></p><div class="bar">${chip('n',10,'10')}${chip('n',20,'20')}${chip('n',30,'30')}</div>
      <button class="btn" id="qstart">Start quiz</button></div>`;
    return;
  }
  if (QZ.phase === 'done') {
    const pct = Math.round(QZ.score / QZ.qs.length * 100);
    view.innerHTML = `<div class="panel done"><p class="big">${QZ.score} / ${QZ.qs.length}</p><p class="sub">${pct}% correct</p>
      ${QZ.missed.length ? `<p style="text-align:left"><b>Missed:</b></p><ul class="missed">${QZ.missed.map(m => `<li><b>${esc(m.name)}</b>${esc(m.answer)}</li>`).join('')}</ul>` : '<p>No misses. Run it again on the other chapter.</p>'}
      <div class="row">${QZ.missed.length ? '<button class="btn" id="qretry">Retry the missed ones</button>' : ''}<button class="btn ghost" id="qnew">New quiz</button></div></div>`;
    return;
  }
  const q = QZ.qs[QZ.i];
  const answered = QZ.picked !== null;
  view.innerHTML = `<div class="meter" aria-hidden="true"><i style="width:${Math.round(QZ.i / QZ.qs.length * 100)}%;background:var(--accent)"></i></div>
    <div class="meta"><span>Question ${QZ.i + 1} of ${QZ.qs.length}</span><span>${QZ.score} correct</span></div>
    <div class="sub">${esc(q.lead)}</div><div class="q">${esc(q.prompt)}</div>
    <div class="opts">${q.opts.map((o, k) => `<button class="opt ${answered ? (o === q.answer ? 'right' : (k === QZ.picked ? 'wrong' : '')) : ''}" data-k="${k}" ${answered ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>
    ${answered ? `<p class="fb">${q.opts[QZ.picked] === q.answer ? '<b class="ok">Right.</b>' : '<b class="no">Not quite.</b>'} ${esc(q.why)}</p><button class="btn" id="qnext">${QZ.i + 1 === QZ.qs.length ? 'See results' : 'Next question'}</button>` : ''}`;
}
view.addEventListener('click', e => {

const TL = { set: 'one', pool: [], placed: [], checked: false };
function resetTL() {

  TL.pool = shuffle(evs.map(e => e.id)); TL.placed = []; TL.checked = false;
}
const evById = id => EVENTS.find(e => e.id === id);
const DEC = { picked: {} };
function renderTimeline() {

  const sorted = TL.placed.concat(TL.pool).map(evById).sort((a, b) => a.y - b.y);
  const chip = (v, label) => `<button class="chip" data-s="${v}" aria-pressed="${TL.set === v}">${label}</button>`;
  let html = `<div class="section"><h2>Put them in order</h2><p class="sub">Tap events from earliest to most recent. Tap a placed event to take it back out.</p>
    <div class="bar">${chip('one','Set one')}${chip('two','Set two')}${chip('all','All 20 mixed')}</div>
    <div class="pool">${TL.pool.map(id => `<button class="ev" data-add="${id}">${esc(evById(id).n)}</button>`).join('') || '<span class="sub">All placed.</span>'}</div>
    <ol class="order">`;
  for (let i = 0; i < total; i++) {

  if (TL.checked) {
    const right = TL.placed.filter((id, i) => evById(id).y === sorted[i].y).length;

}
function stepsBar() {
  const cur = STEPS.findIndex(s => s[0] === L.step);
  return `<div class="steps">${STEPS.map((s, i) => `<span class="${i === cur ? 'on' : (i < cur || L.step === 'done' ? 'past' : '')}">${i + 1}. ${s[1]}</span>`).join('')}</div>`;
}
function learnLesson() {
  const les = L.lesson;
  let h = `<div class="bar"><button class="chip" data-act="home">&larr; All lessons</button><span class="spacer"></span><span class="sub">${esc(les.title)} &middot; ${les.span}</span></div>${stepsBar()}`;
  if (L.step === 'read') {
    const ev = LEV[les.ids[L.idx]];
    h += `<p class="sub">${esc(les.big)}</p><div class="strip">${les.ids.map((id, i) => `<span class="${i === L.idx ? 'cur' : ''}">${esc(LEV[id].d)}</span>`).join('')}</div>
      <div class="study"><div class="yearbig">${esc(ev.d)}</div><h2>${esc(ev.n)}</h2>
      <div class="lab">What happened</div><p>${esc(ev.what)}</p>
      <div class="lab">Why it matters</div><p>${esc(ev.why)}</p>
      <div class="hook"><div class="lab">Memory hook</div><p>${esc(ev.hook)}</p></div>
      ${ev.note ? `<p class="note">${esc(ev.note)}</p>` : ''}</div>
      <div class="row"><button class="btn ghost" data-act="prev" ${L.idx === 0 ? 'disabled' : ''}>Back</button><button class="btn" data-act="next">${L.idx === les.ids.length - 1 ? 'Test me' : 'Next event'}</button></div>`;
  } else if (L.step === 'pick' || L.step === 'type') h += qView();
  else if (L.step === 'order') h += orderView();
  else {
    const sorted = les.ids.map(id => LEV[id]).sort((a, b) => a.y - b.y);
    const nextL = LESSONS.filter(l => l.track === les.track)[LESSONS.filter(l => l.track === les.track).indexOf(les) + 1];
    h += `<div class="panel"><h2>Lesson done</h2><p class="sub">Say these out loud once, earliest first.</p><ul class="key">${sorted.map(e => `<li><span class="yr">${esc(e.d)}</span><span>${esc(e.n)}</span></li>`).join('')}</ul>
      <div class="row">${nextL ? `<button class="btn" data-act="start" data-id="${nextL.id}">Next lesson: ${esc(nextL.title)}</button>` : ''}<button class="btn ghost" data-act="home">All lessons</button></div></div>`;
  }
  view.innerHTML = h;
}
function qView() {
  const item = L.queue[0], ev = LEV[item.id], left = L.queue.length;
  let h = `<div class="meta"><span>${left} to go${item.tries ? ' (second try)' : ''}</span><span>${L.phase === 'review' ? 'Review' : (item.mode === 'pick' ? 'Pick the year' : 'Type the year')}</span></div>`;
  if (item.mode === 'pick') {
    if (!item.opts) item.opts = mcOptions(ev);
    h += `<div class="q">When did "${esc(ev.n)}" happen?</div><div class="opts">${item.opts.map((o, k) => `<button class="opt ${L.fb ? (o === ev.d ? 'right' : (k === L.picked ? 'wrong' : '')) : ''}" data-act="opt" data-k="${k}" ${L.fb ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
  } else {
    const nb = neighbors(ev);
    h += `<div class="q">What year: "${esc(ev.n)}"?</div>
      <input class="yr-in" id="typeIn" inputmode="numeric" autocomplete="off" placeholder="Year" aria-label="Year" ${L.fb ? 'disabled value="' + (L.fb.typed || '') + '"' : ''}>
      ${L.fb ? '' : `<div class="row"><button class="btn" data-act="typecheck">Check</button><button class="btn ghost" data-act="hint">Hint</button></div>${L.hint ? `<p class="sub" style="margin-top:12px">It came ${nb.prev ? 'after ' + esc(nb.prev.n) + ' (' + esc(nb.prev.d) + ')' : ''}${nb.prev && nb.next ? ' and ' : ''}${nb.next ? 'before ' + esc(nb.next.n) + ' (' + esc(nb.next.d) + ')' : ''}.</p>` : ''}`}`;
  }
  if (L.fb) {
    h += `<p class="fb">${L.fb.ok ? '<b class="ok">Right.</b>' : '<b class="no">Not quite.</b>'} ${esc(ev.d)}: ${esc(ev.n)}.</p><div class="hook"><div class="lab">Memory hook</div><p>${esc(ev.hook)}</p></div><div class="row" style="margin-top:14px"><button class="btn" id="qcont" data-act="qcont">Continue</button></div>`;
  }
  return h;
}
function orderView() {
  const evs = L.lesson.ids.map(id => LEV[id]), total = evs.length;
  const sorted = evs.slice().sort((a, b) => a.y - b.y);
  const allRight = L.checked && L.placed.every((id, i) => LEV[id].y === sorted[i].y);
  let h = `<div class="q">Put them in order, earliest first.</div><div class="pool">${L.pool.map(id => `<button class="ev" data-act="place" data-id="${id}">${esc(LEV[id].n)}</button>`).join('') || '<span class="sub">All placed.</span>'}</div><ol class="order">`;
  for (let i = 0; i < total; i++) {
    const id = L.placed[i];
    if (id) { const e = LEV[id]; h += `<li class="filled ${L.checked ? (e.y === sorted[i].y ? 'ok' : 'no') : ''}"><button data-act="unplace" data-i="${i}">${esc(e.n)}</button>${L.checked ? `<span class="yr">${esc(e.d)}</span>` : ''}</li>`; }
    else h += '<li></li>';
  }
  h += '</ol>';
  if (L.checked) h += `<p class="fb"><b class="${allRight ? 'ok' : 'no'}">${allRight ? 'Correct order.' : 'Not quite. Correct order:'}</b></p><ul class="key">${sorted.map(e => `<li><span class="yr">${esc(e.d)}</span><span>${esc(e.n)}</span></li>`).join('')}</ul>`;
  h += `<div class="row">${L.checked ? (allRight ? '<button class="btn" data-act="finish">Finish lesson</button>' : '<button class="btn" data-act="ordreset">Try again</button>') : `<button class="btn" data-act="ordcheck" ${L.placed.length === total ? '' : 'disabled'}>Check order</button>`}</div>`;
  return h;
}
function learnReview() {
  if (L.step === 'rdone') {
    const weak = LV.seen.filter(id => LEV[id] && lvl(id) < 3).length;
    view.innerHTML = `<div class="panel done"><p class="big">${L.rv.ok} / ${L.rv.n}</p><p class="sub">right on the first try.</p><p>${weak} dates still need work.</p>
      <div class="row">${weak ? '<button class="btn" data-act="review">Review again</button>' : ''}<button class="btn ghost" data-act="home">All lessons</button></div></div>`;
    return;
  }
  view.innerHTML = `<div class="bar"><button class="chip" data-act="home">&larr; All lessons</button></div>${qView()}`;
}
view.addEventListener('click', e => {
  if (tab !== 'learn') return;
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'track') { L.track = Number(t.dataset.v); renderLearn(); }
  else if (a === 'start') startLesson(t.dataset.id);
  else if (a === 'review') startReview();
  else if (a === 'home') { L.phase = 'home'; renderLearn(); }
  else if (a === 'cheat') { L.cheat = !L.cheat; renderLearn(); }
  else if (a === 'prev') { L.idx = Math.max(0, L.idx - 1); renderLearn(); }
  else if (a === 'next') { if (L.idx < L.lesson.ids.length - 1) { L.idx++; renderLearn(); } else { beginStage('pick'); renderLearn(); } }
  else if (a === 'opt' && !L.fb) { const item = L.queue[0]; L.picked = Number(t.dataset.k); L.fb = { ok: item.opts[L.picked] === LEV[item.id].d }; renderLearn(); }
  else if (a === 'typecheck') typeCheck();
  else if (a === 'hint') { L.hint = true; renderLearn(); }
  else if (a === 'qcont') qContinue();
  else if (a === 'place') { L.pool = L.pool.filter(x => x !== t.dataset.id); L.placed.push(t.dataset.id); renderLearn(); }
  else if (a === 'unplace' && !L.checked) { L.pool.push(L.placed.splice(Number(t.dataset.i), 1)[0]); renderLearn(); }
  else if (a === 'ordcheck') { L.checked = true; renderLearn(); }
  else if (a === 'ordreset') { L.pool = shuffle(L.lesson.ids); L.placed = []; L.checked = false; renderLearn(); }
  else if (a === 'finish') { if (!LV.done.includes(L.lesson.id)) LV.done.push(L.lesson.id); saveLV(); L.step = 'done'; renderLearn(); }
});
function typeCheck() {
  const inp = document.getElementById('typeIn'); if (!inp) return;
  const v = parseInt(inp.value.replace(/\D/g, ''), 10); if (isNaN(v)) return;
  const item = L.queue[0], ev = LEV[item.id], ok = ev.accept.includes(v);
  L.fb = { ok, typed: v };
  if (item.tries === 0) { LV.ev[item.id] = ok ? Math.min(3, lvl(item.id) + 1) : Math.max(0, lvl(item.id) - 1); saveLV(); }
  renderLearn();
}
view.addEventListener('keydown', e => { if (tab === 'learn' && e.key === 'Enter' && e.target.id === 'typeIn') { e.preventDefault(); typeCheck(); } });

/* ---------- keyboard for flashcards ---------- */
document.addEventListener('keydown', e => {
  if (tab !== 'cards' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ' && FC.pos < FC.deck.length && e.target === document.body) { e.preventDefault(); FC.flipped = !FC.flipped; renderCards(); }
  else if (e.key === 'ArrowRight' && FC.pos < FC.deck.length) fcAdvance();
  else if (e.key === 'ArrowLeft' && FC.pos > 0) { FC.pos--; FC.flipped = false; renderCards(); }
});

/* ---------- boot ---------- */
(function boot() {
  const h = location.hash.slice(1);
  if (TABS.some(t => t[0] === h)) tab = h;
  drawTabs(); render();
})();
</script>
</body>
</html>
